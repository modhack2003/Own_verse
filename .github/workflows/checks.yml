name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - name: Start disposable MongoDB replica set
        run: |
          docker run --detach --name throttle-mongo --publish 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec throttle-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'; then
              break
            fi
            sleep 1
          done
          docker exec throttle-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
      - name: Verify concurrent throttle limits
        run: npx tsx scripts/test-throttles.ts
        env:
          THROTTLE_TEST_DATABASE_URL: mongodb://127.0.0.1:27017/studio_throttle_test?replicaSet=rs0
      - name: Verify Security Insights imports with MongoDB
        run: npx tsx scripts/test-insights.ts
        env:
          INSIGHTS_TEST_DATABASE_URL: mongodb://127.0.0.1:27017/studio_insights_test?replicaSet=rs0
      - name: Verify transactional content recovery with MongoDB
        run: npm run test:recovery
        env:
          RECOVERY_TEST_DATABASE_URL: mongodb://127.0.0.1:27017/studio_recovery_test?replicaSet=rs0
      - name: Seed synthetic browser-test content
        run: npx tsx scripts/seed-e2e.ts
        env:
          E2E_DATABASE_URL: mongodb://127.0.0.1:27017/studio_e2e_test?replicaSet=rs0
      - name: Create browser-test indexes
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/studio_e2e_test?replicaSet=rs0
      - name: Verify content check refuses an unavailable database
        run: |
          if DATABASE_URL='' npm run content:check; then
            echo 'Content check unexpectedly accepted an unavailable database'
            exit 1
          fi
      - run: npm run build
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/studio_e2e_test?replicaSet=rs0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: mongodb://127.0.0.1:27017/studio_e2e_test?replicaSet=rs0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
